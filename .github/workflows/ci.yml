name: Build and Track Box3D Upstream

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily at 02:00 UTC: pull Erin Catto's upstream, build, test, commit the bump, publish a release
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile WASM and TypeScript
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      submodule-sha: ${{ steps.record-submodule.outputs.sha }}
      submodule-changed: ${{ steps.record-submodule.outputs.changed }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Update Box3D Submodule (if scheduled/dispatched)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git submodule update --remote --merge vendor/box3d

      - name: Record Tested Submodule SHA
        id: record-submodule
        run: |
          SHA=$(git -C vendor/box3d rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          if ! git diff --quiet vendor/box3d; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@6ab5eb532922718e268a739b8bc7ccf965d5ef18 # v14
        with:
          version: 4.0.18

      - name: Verify Emscripten
        run: emcc --version

      - name: Set up pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d792dbb42340d40a0ec # v3.0.0
        with:
          version: 10.5.2

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.14.0
          cache: 'pnpm'

      - name: Install Node Dependencies
        run: pnpm install

      - name: Build WASM (SIMD, Scalar, Threads)
        run: |
          bash scripts/build.sh simd
          bash scripts/build.sh scalar
          bash scripts/build.sh threads

      - name: Build TypeScript
        run: pnpm run build:ts

      - name: Smoke test (SIMD and scalar must agree)
        run: pnpm test

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: box3d-wasm-dist
          path: dist/
          retention-days: 14

  update-upstream:
    name: Commit Upstream Submodule Updates
    needs: build
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && needs.build.outputs.submodule-changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Download Build
        uses: actions/download-artifact@v4.1.8
        with:
          name: box3d-wasm-dist
          path: dist/

      - name: Commit Tested Submodule Revision
        run: |
          git -C vendor/box3d checkout ${{ needs.build.outputs.submodule-sha }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vendor/box3d
          git commit -m "chore(vendor): bump upstream box3d to ${{ needs.build.outputs.submodule-sha }}"
          git push

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT=$(echo "${{ needs.build.outputs.submodule-sha }}" | cut -c1-9)
          gh release create "box3d-$SHORT" dist/*.wasm dist/box3d*.js \
            --title "Box3D $SHORT" \
            --notes "Built from erincatto/box3d@${{ needs.build.outputs.submodule-sha }}. Files: box3d (SIMD), box3d.scalar, box3d.threads."
