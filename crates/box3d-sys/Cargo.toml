[package]
name = "box3d-sys"
version = "0.1.0"
edition = "2021"
description = "Box3D (Erin Catto) compiled from C for wasm32-unknown-unknown, with a flat C glue API"
license = "MIT"
links = "box3d"
build = "build.rs"

[dependencies]
rayon = { version = "1", optional = true }

[features]
# use_rayon: run Box3D's parallel work on the rayon pool
rayon = ["dep:rayon"]

[build-dependencies]
cc = "1"

[lib]
path = "src/lib.rs"
